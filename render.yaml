services:
  - type: web
    name: ecosync
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ECOSYNC_DATABASE_PATH
        value: /var/data/ecosync.db
      - key: ECOSYNC_UPLOAD_FOLDER
        value: /var/data/uploads
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: ecosync-data
      mountPath: /var/data
      sizeGB: 1
